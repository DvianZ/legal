 else if(d.cnok!==undefined){var cx=S.sessions[+d.cnok];cx.rf=hrs(cx)>=24?(cx.pr||0):0;cx.st="batal";CN=null;save();render();toast(cx.rf?"Sesi dibatalkan. Dana dikembalikan.":"Sesi dibatalkan.")}
 else if(d.rm!==undefined){var rx=S.sessions[+d.rm];S.rem.push({id:Date.now(),t:"Sesi dengan "+(rx.who||"konsultan"),d:rx.d,done:false});rx.rm=1;save();render();toast("Pengingat dibuat")}
 else if(d.pk){PID=d.pk;tab="pk";render()}
 else if(d.ag){var on=!P["ag"+d.ag];P["ag"+d.ag]=on;el.classList.toggle("done",on);el.querySelector(".box").textContent=on?"✓":"";el.setAttribute("aria-checked",on)}
 else if(d.tnc){if(!(P.ag1&&P.ag2)){toast("Centang kedua pernyataan dulu");return}P.step="co";render()}
 else if(d.bk){if(P.step=="co"){P.step="tnc";render()}else if(P.item.kind=="paket"){PID=P.item.id;tab="pk";render()}else go("book")}
});
document.addEventListener("keydown",function(e){if((e.key=="Enter"||e.key==" ")&&e.target.dataset&&(e.target.dataset.t||e.target.dataset.read||e.target.dataset.pk||e.target.dataset.ag)){e.preventDefault();e.target.click()}});
render();
</script>
